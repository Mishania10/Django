<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Сервис обращений{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #222; background: #f5f5f5; }
    header { background: #333; }
    nav { max-width: 900px; margin: auto; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    nav a { color: white; text-decoration: none; }
    nav .brand { font-weight: bold; }
    .nav-links { display: flex; align-items: center; gap: 14px; }
    nav .logout { margin: 0; }
    nav button { padding: 6px 10px; background: #555; }
    main { max-width: 680px; margin: 32px auto; padding: 0 16px; }
    .card { padding: 24px; background: white; border: 1px solid #ddd; }
    h1 { margin-top: 0; }
    .muted { color: #666; line-height: 1.5; }
    form { margin-top: 20px; }
    .field { margin: 16px 0; }
    label { display: block; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 9px; border: 1px solid #aaa; font: inherit; }
    textarea { resize: vertical; }
    .errors { margin-top: 5px; color: #b00020; font-size: 14px; }
    button, .button { display: inline-block; padding: 9px 14px; border: 0; background: #333; color: white; font: inherit; text-decoration: none; cursor: pointer; }
    .button.secondary { background: #777; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .ticket { padding: 14px 0; border-bottom: 1px solid #ddd; }
    .ticket:last-child { border-bottom: 0; }
    .ticket a { color: #174b8f; }
    .badge { display: inline-block; padding: 3px 8px; background: #eee; font-size: 13px; }
    dl { display: grid; grid-template-columns: 140px 1fr; gap: 10px; }
    dt { color: #666; } dd { margin: 0; }
    @media(max-width: 560px) { main { margin: 20px auto; } .card { padding: 18px; } dl { grid-template-columns: 1fr; gap: 4px; } dd { margin-bottom: 8px; } }
  </style>
</head>
<body>
  <header><nav><a class="brand" href="{% url 'create_request' %}">Сервис обращений</a><span class="nav-links"><a href="{% url 'my_requests' %}">Мои обращения</a>{% if user.is_authenticated %}<form class="logout" method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Выйти</button></form>{% else %}<a href="{% url 'login' %}">Войти</a><a href="{% url 'register' %}">Регистрация</a>{% endif %}</span></nav></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
