<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Сервис обращений{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #222; background: #f5f5f5; }
    header { background: #333; }
    nav {
      max-width: 900px;
      min-height: 58px;
      margin: auto;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    nav a { color: white; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    nav .brand { font-weight: bold; }
    .nav-links { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
    nav .logout { margin: 0; }
    nav button { min-height: 38px; padding: 6px 10px; background: #555; }
    main { width: 100%; max-width: 680px; margin: 32px auto; padding: 0 16px; }
    .card { min-width: 0; padding: 24px; background: white; border: 1px solid #ddd; }
    h1 { margin-top: 0; line-height: 1.2; overflow-wrap: anywhere; }
    .muted { color: #666; line-height: 1.5; }
    form { margin-top: 20px; }
    .field { min-width: 0; margin: 16px 0; }
    label { display: block; margin-bottom: 6px; }
    input, select, textarea {
      display: block;
      width: 100%;
      min-height: 44px;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 3px;
      font: inherit;
      font-size: 16px;
    }
    input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible {
      outline: 2px solid #1759a8;
      outline-offset: 2px;
    }
    textarea { min-height: 120px; resize: vertical; }
    .errors { margin-top: 5px; color: #b00020; font-size: 14px; }
    button, .button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 9px 14px;
      border: 0;
      border-radius: 3px;
      background: #333;
      color: white;
      font: inherit;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .button.secondary { background: #777; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .ticket { min-width: 0; padding: 14px 0; border-bottom: 1px solid #ddd; }
    .ticket:last-child { border-bottom: 0; }
    .ticket a { color: #174b8f; overflow-wrap: anywhere; }
    .badge { display: inline-block; padding: 4px 8px; background: #eee; font-size: 13px; }
    dl { display: grid; grid-template-columns: minmax(100px, 140px) minmax(0, 1fr); gap: 10px; }
    dt { color: #666; }
    dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }
    @media (max-width: 600px) {
      nav { align-items: flex-start; flex-direction: column; gap: 10px; padding: 12px 16px; }
      .nav-links { width: 100%; justify-content: flex-start; flex-wrap: wrap; gap: 10px 16px; }
      main { margin: 20px auto; padding: 0 12px; }
      .card { padding: 18px; }
      .actions { flex-direction: column; }
      .actions .button, .card form > button { width: 100%; }
    }
    @media (max-width: 380px) {
      .card { padding: 15px; }
      dl { grid-template-columns: 1fr; gap: 3px; }
      dd { margin-bottom: 8px; }
    }
  </style>
</head>
<body>
  <header><nav><a class="brand" href="{% url 'create_request' %}">Сервис обращений</a><span class="nav-links"><a href="{% url 'my_requests' %}">Мои обращения</a>{% if user.is_authenticated %}<form class="logout" method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Выйти</button></form>{% else %}<a href="{% url 'login' %}">Войти</a><a href="{% url 'register' %}">Регистрация</a>{% endif %}</span></nav></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
